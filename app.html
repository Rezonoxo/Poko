<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Required for Google OAuth popup -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none">
    <!-- CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com; frame-src https://accounts.google.com https://content.googleapis.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com https://api.anthropic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;">
    <title>Poko — Personal Budget</title>

    <!-- PWA -->
    <link rel="manifest" href="/Poko/manifest.json" />
    <meta name="theme-color" content="#E53935" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Poko" />
    <link rel="apple-touch-icon" href="/Poko/icon-192.png" />

    <!-- favicon -->
    <link rel="icon" type="image/png" href="/Poko/icon-192.png" />

    <!-- SEO -->
    <meta name="description" content="Poko — osobisty menedżer budżetu. Śledź dochody, wydatki, długi i cele. Bezpłatny, prywatny, bez rejestracji." />
    <script type="module" crossorigin src="/Poko/assets/app-vuhyDJmu.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/Poko/sw.js', { scope: '/Poko/' })
            .then(reg => {
              console.log('SW registered, scope:', reg.scope);
              // check for updates
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('New SW available — reload to update');
                  }
                });
              });
            })
            .catch(err => console.error('SW registration failed:', err));
        });
      }

      // PWA install prompt
      let deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
        // show install banner after 3s if not already installed
        setTimeout(() => {
          if (deferredPrompt) {
            const banner = document.createElement('div');
            banner.id = 'pwa-banner';
            banner.innerHTML = `
              <div style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
                background:#0D0D0D;color:#fff;border-radius:14px;padding:14px 20px;
                display:flex;align-items:center;gap:12px;z-index:9000;
                box-shadow:0 8px 32px rgba(0,0,0,.4);font-family:system-ui,sans-serif;
                max-width:340px;width:90%;">
                <div style="flex:1">
                  <div style="font-weight:800;font-size:14px;margin-bottom:3px">Zainstaluj Poko</div>
                  <div style="font-size:12px;color:#888">Dodaj do ekranu głównego</div>
                </div>
                <button id="pwa-install" style="background:#E53935;color:#fff;border:none;
                  border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;
                  font-family:inherit;white-space:nowrap;">Zainstaluj</button>
                <button id="pwa-dismiss" style="background:none;border:none;color:#666;
                  font-size:20px;cursor:pointer;padding:0 4px;line-height:1;">×</button>
              </div>`;
            document.body.appendChild(banner);
            document.getElementById('pwa-install').addEventListener('click', () => {
              deferredPrompt.prompt();
              deferredPrompt.userChoice.then(() => { deferredPrompt = null; banner.remove(); });
            });
            document.getElementById('pwa-dismiss').addEventListener('click', () => banner.remove());
          }
        }, 3000);
      });
    </script>
  </body>
</html>
